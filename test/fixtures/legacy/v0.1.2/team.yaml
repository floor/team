# The team that works on this repository, for `team check` in CI.
# A project's own file is private, at .agents/team.yaml; this one is tracked
# because CI needs the signature rules and the seats that may sign.
format: 1
project: team
visibility: public
coordinator: claude-coordinator
operator: claude-coordinator

identity:
  since: 28f2fb56d5b4aaee51cd73e4b0a34b76dd65e803
  forbidden_public:
    - "\\bFLO-[0-9]+\\b"   # internal tracker ids: this repository's issues are #<number>

workspace:
  mode: shared

seats:
  - role: coordinator
    name: claude-coordinator
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  - role: implementer
    name: claude-implementer
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  - role: reviewer
    name: claude-reviewer
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  # Vendor seats: floor/teamcli is also built by vendor agents, each signing with its display.
  - role: implementer
    name: deepseek-implementer
    cli: claude-code
    vendor: deepseek
    model: DeepSeek Flash
    version: "V4.1"
    display: DeepSeek V4.1 Flash
    launch: claude-deepseek

  - role: implementer
    name: glm-implementer
    cli: claude-code
    vendor: zai
    model: GLM
    version: "5.3"
    display: GLM 5.3
    launch: claude-glm

  - role: implementer
    name: grok-implementer
    cli: cursor
    vendor: xai
    model: Grok
    version: "4.7"
    launch: cursor-agent

  - role: implementer
    name: astra-implementer
    cli: codex
    vendor: openai
    model: GPT Astra
    version: "6"
    display: GPT-6 Astra
    launch: codex

  - role: implementer
    name: gemini-implementer
    cli: antigravity
    vendor: google
    model: Gemini Flash
    version: "3.8"
    display: Gemini 3.8 Flash
    launch: agy

  - role: operator
    name: claude-operator
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5
