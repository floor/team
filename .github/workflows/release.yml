# Publishes team to npm when a version tag is pushed, with npm trusted
# publishing: the workflow's identity is what npm trusts (bound once on
# npmjs.com by the package owner — the package `team`, this repository and this
# file), no token is stored, and the release carries provenance. A pre-release
# version (x.y.z-next.N) goes under the `next` dist-tag, anything else under
# `latest`.
# The 0.1.0 release itself is a manual `npm publish` from a clean main; this
# workflow is for the releases after it.
# Never push this repository's version tags to another repository with a
# publish workflow (floor/material's Release runs on any v* tag): a pushed tag
# starts a publish there.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: The tag must be the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run ci

      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"

  # The GitHub Release for the tag, once npm has the version: the CHANGELOG.md
  # section for it. A pre-release is marked one and never becomes Latest. Run
  # again on the same tag, it finds the release and stops. Only this job writes
  # to the repository, with the workflow's own token.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The release $tag exists; nothing to do."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v version="$version" '
            /^## / && index($0, "[" version "]") > 0 { inside = 1; next }
            inside && /^## / { exit }
            inside && /^\[[^]]+\]:/ { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          case "$version" in
            *-*) flags="--prerelease --latest=false" ;;
            *) flags="--latest" ;;
          esac
          gh release create "$tag" --title "team $version" --notes-file "$notes" --verify-tag $flags
