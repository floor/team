name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The two systems the watch reads: Linux answers from /proc, macOS from its own commands.
    # Both run the same `bun run ci`, so neither path rots unseen.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `team check` reads the history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # The live-herdr tests skip themselves: TEAM_LIVE_UP is not set here.
      - run: bun run ci
      - run: bun run contract:check

      # The release's tarball guard, on every pull request, so the real path is
      # exercised before any tag. The filename comes from npm's own --json
      # report, never a glob.
      - name: Pack the tarball
        id: pack
        run: |
          filename="$(npm pack --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          test -f "$filename" || { echo "npm pack reported '$filename', which is not a file" >&2; exit 1; }
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"

      - name: No internal ticket references in the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun scripts/check-pack.ts "$TARBALL"

      - name: Every commit and the pull request body are signed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s' "$BODY" | node dist/cli.js check "origin/$BASE..HEAD" --pr - --file .github/team.yaml
          else
            case "$BEFORE" in
              *[!0]*) node dist/cli.js check "$BEFORE..HEAD" --file .github/team.yaml ;;
              # A first push has no commit before it.
              *) node dist/cli.js check HEAD --file .github/team.yaml ;;
            esac
          fi
