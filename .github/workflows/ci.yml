name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `team check` reads the history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: The built command runs on Node
        run: node dist/cli.js --version
      - name: Every commit and the pull request body are signed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s' "$BODY" | node dist/cli.js check "origin/$BASE..HEAD" --pr - --file .github/team.yaml
          else
            case "$BEFORE" in
              *[!0]*) node dist/cli.js check "$BEFORE..HEAD" --file .github/team.yaml ;;
              # A first push has no commit before it.
              *) node dist/cli.js check HEAD --file .github/team.yaml ;;
            esac
          fi
