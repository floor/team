# Cursor's screen. "To resume this session:" is unknown, and the core reads
# unknown before trust. The braille range is written as characters: \u is refused.
format: 1
cli: cursor
binary: cursor-agent
process_names:
  - cursor-agent
tested:
  from: '2026.10.01'
  to: '2026.10.01'
unattended:
  - --force
  - --sandbox
  - disabled
rules: first-message
login:
  check:
    - status
  hint: cursor-agent login
exit: /exit
timeouts:
  idle: 90s
  exit: 30s
models:
  option:
    - --model
  ids:
    - match: '^(?:cursor-)?grok-([0-9]+(?:\.[0-9]+)*)(?:-(?:xhigh|high|medium|low)(?:-fast)?|-fast)?$'
      ignore_case: true
      model: Grok
      version: '{1}'
status_model:
  - match: '(?:^|\s)Grok\s+([0-9]+(?:\.[0-9]+)*)\b'
    model: Grok
    version: '{1}'
screen:
  unknown:
    - any: ['To resume this session:']
  trust:
    - all:
        - 'Do you trust the contents of this'
        - 'directory\?'
        - '\[a\] Trust this workspace'
        - '\[q\] Quit'
      none_after:
        anchor: 'Use arrow keys to navigate, Enter to'
        patterns:
          - '^\s*→'
          - '^\s+Grok\s+[0-9]'
  working:
    # The running turn is the braille spinner (whatever verb it paints), the
    # prompt line ending in "ctrl+c to stop", or the follow-up queue: the box's
    # `enter …` hint row with, below it, the composer's own row — empty, or its
    # placeholder. The order is the frame's: what follows the hint row may be
    # chrome or that unpainted composer row and nothing else, so a typed row
    # under the box falls to the composer read and says unsent. A transcript
    # that quotes the box paints its prose lines there, so the queue rule reads
    # them as content and leaves the screen alone. Idle and rules-accepted
    # captures paint none of these.
    - any:
        - '^\s*→.*\s{2,}ctrl\+c to stop\s*$'
        - '^\s*[⠀-⣿]+\s+\S'
    - all:
        - '^\s*│\s*enter (?:steer|interrupt and send) · ↑ select/edit · esc cancel\s*│\s*$'
        - '^\s*→\s*(?:Add a follow-up|Plan, search, build anything)?\s*$'
      none_after:
        anchor: '^\s*│\s*enter (?:steer|interrupt and send) · ↑ select/edit · esc cancel\s*│\s*$'
        patterns:
          - match: '^\s*\S'
            except:
              - '^\s*[│┌└─┐┘├┤]'
              - '^\s*[⠀-⣿]'
              - '^\s*Tip:'
              - '^\s*→\s*(?:Add a follow-up|Plan, search, build anything)?\s*$'
              - '^\s+Grok\s'
              - '^\s*<workspace>'
              - '^\s*~/'
              - '^\s*❯'
  composer:
    mode: status-then-one
    status_line: '^\s+Grok\s+[0-9]'
    prompt: '^\s*→'
    strip_suffix: '\s*ctrl\+c to stop\s*$'
    placeholders:
      - equals: ''
      - equals: Plan, search, build anything
      - equals: Add a follow-up
    fallback:
      - all:
          - match: '^\s*→\s+\S'
            except: ['\sExit\s*$']
          - '^\s*→?\s*/\S+\s+Exit\s*$'
        kind: unsent
