# Cursor's screen. "To resume this session:" is unknown, and the core reads
# unknown before trust. The braille range is written as characters: \u is refused.
format: 1
cli: cursor
binary: cursor-agent
process_names:
  - cursor-agent
tested:
  from: '2026.10.01'
  to: '2026.10.01'
unattended:
  - --force
  - --sandbox
  - disabled
rules: first-message
login:
  check:
    - status
  hint: cursor-agent login
exit: /exit
timeouts:
  idle: 90s
  exit: 30s
models:
  option:
    - --model
  ids:
    - match: '^(?:cursor-)?grok-([0-9]+(?:\.[0-9]+)*)(?:-(?:xhigh|high|medium|low)(?:-fast)?|-fast)?$'
      ignore_case: true
      model: Grok
      version: '{1}'
status_model:
  - match: '(?:^|\s)Grok\s+([0-9]+(?:\.[0-9]+)*)\b'
    model: Grok
    version: '{1}'
screen:
  unknown:
    - any: ['To resume this session:']
  trust:
    - all:
        - 'Do you trust the contents of this'
        - 'directory\?'
        - '\[a\] Trust this workspace'
        - '\[q\] Quit'
      none_after:
        anchor: 'Use arrow keys to navigate, Enter to'
        patterns:
          - '^\s*→'
          - '^\s+Grok\s+[0-9]'
  working:
    # The running turn is the braille spinner, or the prompt line ending in
    # "ctrl+c to stop". Idle and rules-accepted captures do not paint that suffix.
    # The same words quoted in the transcript are not a turn.
    - any:
        - '^\s*→.*\s{2,}ctrl\+c to stop\s*$'
        - '^\s*[⠀-⣿]+\s+(Working|Thinking)\b'
  composer:
    mode: status-then-one
    status_line: '^\s+Grok\s+[0-9]'
    prompt: '^\s*→'
    strip_suffix: '\s*ctrl\+c to stop\s*$'
    placeholders:
      - equals: ''
      - equals: Plan, search, build anything
      - equals: Add a follow-up
    fallback:
      - all:
          - match: '^\s*→\s+\S'
            except: ['\sExit\s*$']
          - '^\s*→?\s*/\S+\s+Exit\s*$'
        kind: unsent
