# Antigravity's screen. Trust and permission are case-insensitive. The slash
# menu's arrow line and the esc footer are chrome, so exit-typed stays unsent.
format: 1
cli: antigravity
binary: agy
process_names:
  - agy
tested:
  from: '1.2.16'
  to: '1.2.16'
unattended:
  - --dangerously-skip-permissions
rules: first-message
login:
  check:
    - models
  hint: agy
exit: /exit
timeouts:
  idle: 90s
  exit: 30s
models:
  option:
    - --model
  ids:
    - match: '^gemini-([0-9]+(?:\.[0-9]+)?)-(flash|pro)(?:-(high|medium|low))?$'
      ignore_case: true
      model: 'Gemini {2:title}'
      version: '{1}'
status_model:
  - match: '(?:^|[\s·|])Gemini\s+([0-9]+(?:\.[0-9]+)*)\s+(Flash|Pro)\b'
    ignore_case: true
    model: 'Gemini {2:title}'
    version: '{1}'
screen:
  chrome:
    - '^\s*↑/↓ Navigate.*$'
    - '^esc to cancel\s+Gemini\s+[0-9].*$'
  trust:
    ignore_case: true
    rules:
      - all:
          - 'Do you trust the contents of this project\?'
          - '>\s*Yes, I trust this folder'
        below_last_rule: 'enter Confirm'
  permission:
    ignore_case: true
    rules:
      - all:
          - 'Requesting permission for:'
          - '^\s*>\s*[0-9]\.\s+Yes\b'
        below_last_rule: '↑/↓ Navigate'
  working:
    - any: ['\bGenerating\.\.\.']
  composer:
    mode: two-rules-footer-below
    ignore_case: true
    prompt: '^\s*>\s*'
    rule: '^\s*[─━]{8,}\s*$'
    footers:
      - '\? for shortcuts'
      - 'Gemini\s+[0-9]'
      - 'esc to cancel'
      - '>\s*/exit\s+Exit'
    placeholders:
      - equals: ''
