# Claude Code's screen. The questions are written out in both cases: the old
# classifier ignored case on those two lines and not on the "1. Yes" choice, and
# ignore_case would apply to the whole rule.
format: 1
cli: claude-code
binary: claude
process_names:
  - claude
tested:
  from: '2.1.288'
  to: '2.1.288'
unattended:
  - --dangerously-skip-permissions
rules:
  option: --append-system-prompt
login:
  check:
    - auth
    - status
  hint: claude auth login
exit: /exit
timeouts:
  idle: 90s
  exit: 30s
models:
  option:
    - --model
  ids:
    - match: '^claude-(opus|sonnet|haiku|fable)-([0-9]+)-([0-9]{1,2})(?:-[0-9]{8})?$'
      model: 'Claude {1:title}'
      version: '{2}.{3}'
    - match: '^claude-(opus|sonnet|haiku|fable)-([0-9]+)(?:-[0-9]{8})?$'
      model: 'Claude {1:title}'
      version: '{2}'
status_model:
  - match: '(?:^|[\s·|])(Opus|Sonnet|Haiku|Fable)\s+([0-9]+(?:\.[0-9]+)*)(?:$|[\s·|])'
    model: 'Claude {1}'
    version: '{2}'
screen:
  trust:
    - all:
        - '(?:[Dd][Oo] [Yy][Oo][Uu] [Tt][Rr][Uu][Ss][Tt] (?:[Tt][Hh][Ii][Ss]|[Tt][Hh][Ee]) [Ff][Oo][Ll][Dd][Ee][Rr]\?|[Oo][Nn][Ee] [Yy][Oo][Uu] [Tt][Rr][Uu][Ss][Tt]\?)'
        - '^\s*[❯›>]?\s*1\.\s+Yes\b'
  permission:
    - any:
        - 'Do you want to (proceed|make this edit|create|allow)'
        - '\bEsc to cancel\b.*\bTab to amend\b'
        - '^\s*❯?\s*[0-9]\. (Yes|No)\b'
  question:
    - any:
        - 'Enter to select'
        - '↑/↓ to navigate'
        - 'Enter to confirm'
        - 'Esc to cancel'
  working:
    - any:
        - '\besc to interrupt\b'
        - '^[^\S\n]*[✢✳✶✻✼✽][^\n]*…\s*\(\s*\d'
  composer:
    mode: box-to-rule
    prompt: '^\s*[❯›>]'
    rule: '^\s*[─━]{8,}'
    placeholders:
      - equals: ''
      - prefix: 'Try "'
