# Claude Code's screen. The trust question carries ignore_case on its own pattern:
# the old classifier ignored case on those lines and not on the "1. Yes" choice,
# and a rule-wide or stage-wide flag would have reached the choice too.
format: 1
cli: claude-code
binary: claude
process_names:
  - claude
tested:
  from: '2.1.288'
  to: '2.1.288'
unattended:
  - --dangerously-skip-permissions
rules:
  option: --append-system-prompt
login:
  check:
    - auth
    - status
  hint: claude auth login
exit: /exit
# The one key that empties the box, from the 2.1.291 capture: ctrl+c returns the
# pane byte-for-byte to its idle screen. Used only to clear an exit text that did not
# read back as typed, and only when the box holds exactly that text.
exit_clear: ctrl+c
# The one key that confirms the CLI's own exit question, from the same 2.1.291 captures
# (test/fixtures/exit-typing/): a seat with background work — a shell, a scheduled task —
# answers the one Enter on `/exit` with "Background work is running" and the preselected
# "❯ 1. Exit and stop tasks", and stays; one more Enter exits it. Declared with the
# `exit_question` stage below: a stop answers that screen only when the profile names both.
exit_confirm: enter
# The files a run of 2.1.291 showed this CLI writing in its working folder: the folder
# stayed empty through the start, the trust dialog, an answered prompt and five idle
# minutes; one scheduler call (CronCreate) made the folder ".claude" and, inside it, the
# regular file below — the scheduler's one lock — and at /exit the CLI deleted the lock
# and left the empty folder. The lobby may hold exactly these paths for this CLI.
lobby_files:
  - .claude/scheduled_tasks.lock
timeouts:
  idle: 90s
  exit: 30s
models:
  option:
    - --model
  ids:
    - match: '^claude-(opus|sonnet|haiku|fable)-([0-9]+)-([0-9]{1,2})(?:-[0-9]{8})?$'
      model: 'Claude {1:title}'
      version: '{2}.{3}'
    - match: '^claude-(opus|sonnet|haiku|fable)-([0-9]+)(?:-[0-9]{8})?$'
      model: 'Claude {1:title}'
      version: '{2}'
status_model:
  - match: '(?:^|[\s·|])(Opus|Sonnet|Haiku|Fable)\s+([0-9]+(?:\.[0-9]+)*)(?:$|[\s·|])'
    model: 'Claude {1}'
    version: '{2}'
    # The families the capture knows, as `Claude {1}` spells them; the versions `{2}` can carry.
    yields: [Claude Opus, Claude Sonnet, Claude Haiku, Claude Fable]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
screen:
  trust:
    - all:
        - match: '(?:Do you trust (?:this|the) folder\?|One you trust\?)'
          ignore_case: true
        - '^\s*[❯›>]?\s*1\.\s+Yes\b'
    - all:
        - '^\s*[❯›>]?\s*Yes, I trust this folder\b'
      footer: 'Enter to confirm · Esc to cancel'
  # A quoted question above the composer's rule is not a dialog. The footer is the
  # captured last line and needs the question. A Yes/No choice below the last rule
  # is the other shape; the mark is optional, as on an unmarked "2. No".
  permission:
    - all:
        - 'Do you want to (proceed|make this edit|create|allow)'
      footer: 'Esc to cancel · Tab to amend'
      below_last_rule: 'Esc to cancel · Tab to amend'
    - below_last_rule: '^\s*❯?\s*[0-9]\. (Yes|No)\b'
    # A pane with no composer rule whose choice is the dialog, including the
    # unmarked "1. Yes" while up is running. A choice quoted above an empty
    # prompt is a transcript: the empty prompt comes after it.
    - all:
        - '^\s*❯?\s*[0-9]\. (Yes|No)\b'
      without_rule: true
      none_after:
        anchor: '^\s*❯?\s*[0-9]\. (Yes|No)\b'
        patterns:
          - '^\s*[❯›>]\s*$'
  # The CLI's own question after the exit text, from the 2.1.291/2.1.292 captures: it names the
  # background work that will stop and preselects "Exit and stop tasks", whose confirming key
  # is `exit_confirm` above. Its footer is an ordinary question's own, so this stage must read
  # before `question` — the core's order runs it first, and a profile cannot move it. Nothing
  # but a stop reads this screen to press a key; every other reader only reports it.
  #
  # The CLI draws the choice list in two real forms, and a rule each admits one and nothing
  # else. Holding the selection where it started, both draw the title row, the "will stop" row,
  # one or more task rows and the marked "Exit and stop tasks" row:
  #
  #     ❯ 1. Exit and stop tasks          ❯ 1. Exit and stop tasks
  #       2. Stay                           2. Move to background and exit
  #                                          3. Stay
  #     Enter to confirm · Esc to cancel  Enter to confirm · Esc to cancel
  #
  # The second form is what a session the CLI can move into the background draws
  # (test/fixtures/exit-typing/, `claude-code-shell-move-question.txt` from the release run's
  # capture, and `claude-code-shell-scheduled-move-question-ansi.txt` from this profile's own
  # scratch capture of a seat holding a shell and a scheduled task at once). The value "Move to
  # background and exit" is never confirmed here: `exit_confirm` is the confirming key of the
  # marked row below it, and a stop means stop. A tail the rule cannot name — another second
  # row, "2. Move to background and exit" without its "3. Stay", any row a form does not carry —
  # is not this dialog: it reads as the ordinary question it looks like, and a stop fails closed.
  #
  # The dialog is read by its own frame, never by phrases found anywhere in the window: a
  # transcript that quotes the lines above an ordinary question still reads as that question,
  # and no Enter may go to it. Three reads carry that, each one positive evidence the captures
  # show: the preselected marker `❯` is on the "Exit and stop tasks" row itself — the row the
  # confirming Enter acts on — the footer is the window's last non-blank line, and `only_after`
  # admits nothing below the choice row but the tail that form draws and that footer. A quote of
  # the lines fails the moment one row of the dialog it was quoted above (a title, a choice, a
  # rule) follows the quoted choice row, which is exactly what an ordinary question drawn below
  # a quote puts there. A frame the window cannot show whole — the choice row without its
  # marker, a quote with the live box cut away — is never read as this dialog: it stays the
  # ordinary question it looks like, and a stop fails closed. A pane too short for the list is
  # not that case: the CLI draws the same dialog clipped by its own row budget — one task row,
  # its own `… +N item` row, the marked choice, the footer, and no other choice at all
  # (`claude-code-shell-scheduled-move-question-clipped-ansi.txt`) — and the marked row is the
  # same preselected "Exit and stop tasks" the one Enter confirms, so it stays part of the first
  # form.
  exit_question:
    - all:
        - 'Background work is running'
        - '^\s*[❯›>]\s*1\.\s+Exit and stop tasks\b'
      footer: 'Enter to confirm · Esc to cancel'
      only_after:
        anchor: '^\s*[❯›>]\s*1\.\s+Exit and stop tasks\b'
        patterns:
          - '^\s*2\.\s+Stay\b'
          - '^\s*Enter to confirm · Esc to cancel\s*$'
    - all:
        - 'Background work is running'
        - '^\s*[❯›>]\s*1\.\s+Exit and stop tasks\b'
        - '^\s*2\.\s+Move to background and exit\b'
        - '^\s*3\.\s+Stay\b'
      footer: 'Enter to confirm · Esc to cancel'
      only_after:
        anchor: '^\s*[❯›>]\s*1\.\s+Exit and stop tasks\b'
        patterns:
          - '^\s*2\.\s+Move to background and exit\b'
          - '^\s*3\.\s+Stay\b'
          - '^\s*Enter to confirm · Esc to cancel\s*$'
  question:
    # The phrase is the dialog's last line, as a permission footer is. Prose
    # above the box is not a question.
    - any:
        - 'Enter to select'
        - '↑/↓ to navigate'
        - 'Enter to confirm'
        - 'Esc to cancel'
      on_footer: true
    - below_last_rule: 'Enter to select|↑/↓ to navigate|Enter to confirm|Esc to cancel'
    # The footer has a status line under it and the rule is out of the window.
    # A phrase quoted above an empty prompt is a transcript.
    - any:
        - 'Enter to select'
        - '↑/↓ to navigate'
        - 'Enter to confirm'
        - 'Esc to cancel'
      without_rule: true
      none_after:
        anchor: 'Enter to select|↑/↓ to navigate|Enter to confirm|Esc to cancel'
        patterns:
          - '^\s*[❯›>]\s*$'
  working:
    - any:
        - '\besc to interrupt\b'
        - '^[^\S\n]*[✢✳✶✻✼✽][^\n]*…\s*\(\s*\d'
  composer:
    mode: box-to-rule
    # The prompt sits at the pane's first column, as unsent-typed-ansi.txt draws `❯ Fix the`;
    # the pane draws continuation rows at the content column — two spaces — so a prompt glyph
    # on one of those is content, never the input row. The reader takes the box's first row
    # under its opening rule and anchors this pattern to the captured column: a row the box
    # holds can never be mistaken for the input.
    prompt: '^[❯›>]'
    # The box's two rules, as unsent-typed-ansi.txt draws them: one unbroken run of ─ from the
    # pane's first column, the closing rule the window's last rule row. A rule-looking row the
    # box holds is drawn at the content column and is content, never the frame.
    rule: '^[─━]{8,}$'
    footers:
      - '^\s{2,}.*·.*(?:Opus|Sonnet|Haiku|Fable)\s+[0-9]+.*$'
      - '^\s{2,}(?:⏵⏵\s+)?bypass permissions\b.*$'
    # Claude Code greys every suggestion it shows — "Try …", "Resume briefly.", any other —
    # with faint styling, while typed text carries none. The list below stays the fallback
    # for a source without styling.
    placeholder_style: dim
    placeholders:
      - equals: ''
      - prefix: 'Try "'
